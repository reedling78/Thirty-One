packages:
  - apps/*
  - packages/*

# Expo + Metro expect a flat node_modules
nodeLinker: hoisted

# unrs-resolver's postinstall only fetches a native fallback binary; the JS path works without it.
allowBuilds:
  esbuild: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - expo-dev-client@57.0.20
  - expo-dev-launcher@57.0.21
  - expo-dev-menu@57.0.20
